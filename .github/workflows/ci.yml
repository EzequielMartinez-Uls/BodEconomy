# Revisa que cada cambio compile antes de fusionarlo.
name: Compilar

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # Cuenta las hojas que usa cada documento impreso y falla si alguno desperdicia papel.
      - run: npx playwright install --with-deps chromium
      - run: npm run medir-hojas
      - run: npm run build
        env:
          VITE_SUPABASE_URL: https://ejemplo.supabase.co
          VITE_SUPABASE_ANON_KEY: solo-para-compilar
