# Publica una versión nueva de Bodegón Control en GitHub Releases.
# Se dispara al subir una etiqueta vX.Y.Z (igual a "version" de package.json)
# o a mano desde la pestaña Actions. Las cajas la descargan solas con electron-updater.
name: Publicar versión

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Revisar versión y claves de Supabase
        shell: bash
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          echo "Versión en package.json: $VERSION"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "$VERSION" ]]; then
            echo "::error::La etiqueta $GITHUB_REF_NAME no coincide con package.json ($VERSION)."
            exit 1
          fi
          # Sin estas claves la app compila pero no conecta con la nube; mejor no publicar.
          if [[ -z "$VITE_SUPABASE_URL" || -z "$VITE_SUPABASE_ANON_KEY" ]]; then
            echo "::error::Faltan los secretos VITE_SUPABASE_URL y VITE_SUPABASE_ANON_KEY en Settings > Secrets and variables > Actions."
            exit 1
          fi

      # GitHub solo acepta publicar una release sobre una etiqueta que ya existe.
      # Al correrla a mano desde Actions, se crea la etiqueta de la versión aquí.
      - name: Crear etiqueta si se corrió a mano
        if: github.ref_type != 'tag'
        shell: bash
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          if git ls-remote --exit-code --tags origin "refs/tags/$VERSION" >/dev/null; then
            echo "La etiqueta $VERSION ya existe."
          else
            git tag "$VERSION"
            git push origin "$VERSION"
          fi

      - run: npm ci

      - name: Compilar
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Empaquetar instalador
        run: npx electron-builder --win --publish never

      # Se sube con gh y no con electron-builder: este último solo revisa la
      # primera página de releases (los borradores viejos la llenan), no ve la
      # versión ya creada e intenta crearla dos veces.
      - name: Publicar en GitHub
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          ARCHIVOS=(dist-electron/latest.yml dist-electron/*-"$VERSION".exe dist-electron/*-"$VERSION".exe.blockmap)
          ls -l "${ARCHIVOS[@]}"
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            gh release upload "v$VERSION" "${ARCHIVOS[@]}" --clobber
            gh release edit "v$VERSION" --draft=false --latest
          else
            gh release create "v$VERSION" "${ARCHIVOS[@]}" --title "$VERSION" --notes "Versión $VERSION" --latest
          fi
